<!DOCTYPE html>
<html lang="en" style="background:#0c0710">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 3 — Banjo Spirits</title>
</head>
<body style="background:#0c0710;color:#efe6ff;font-family:system-ui,sans-serif;
             min-height:100vh;margin:0;padding:24px;text-align:center">
<p style="font-size:20px;opacity:.6;margin-top:40px">Behind the card.</p>

<!-- Deliberately the same shape as the welcome card on the front page: a fixed panel
     covering the whole screen with a blurred backdrop. Some phone graphics chips fail on
     that and hand back a blank frame, which is what this page is here to find out. -->
<div style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
     background:rgba(6,3,12,.82);backdrop-filter:blur(4px);padding:20px">
  <div style="background:#160c26;border:1px solid #4a2f6e;border-radius:18px;padding:26px 24px;max-width:440px">
    <p style="font-size:26px;margin:0 0 10px">TEST 3 WORKS</p>
    <p style="font-size:15px;opacity:.7;margin:0">Same blurred card as the front page uses.</p>
  </div>
</div>
</body>
</html>
