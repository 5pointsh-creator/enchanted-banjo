<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tonight's moon — Banjo Spirits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#020308;color:#e9e4d6;font-family:"Segoe UI",system-ui,sans-serif;text-align:center;
       background-image:radial-gradient(120% 60% at 50% 22%, #10162b 0%, #05070f 55%, #020308 100%)}
  .serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
  .top{padding:18px 16px 0;font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:#c9b277}
  .stage{position:relative;height:min(58vh,480px)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 46px}
  .date{font-size:12.5px;letter-spacing:2.5px;text-transform:uppercase;color:#9aa3c2}
  h1{margin-top:6px;font-size:40px;line-height:1.08;font-weight:600;color:#f7f1e1;letter-spacing:.3px}
  .phase{margin-top:6px;font-size:16px;color:#b8bfd9;font-style:italic}
  .rule{display:flex;align-items:center;gap:12px;justify-content:center;margin:22px auto 18px;color:#c9b277;font-size:12px}
  .rule:before,.rule:after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,#c9b27788,transparent)}
  .lore-h{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#c9b277}
  .lore{margin:10px auto 0;max-width:30em;font-size:21px;line-height:1.5;font-style:italic;color:#ece6d6}
  .why{margin:14px auto 0;max-width:34em;font-size:14px;line-height:1.6;color:#a9b1cf}
  .scrub{margin:28px auto 0;max-width:420px;text-align:left}
  .scrub label{display:flex;justify-content:space-between;font-size:12.5px;color:#9aa3c2;margin-bottom:8px}
  .scrub label b{color:#e9dfbf;font-weight:600}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
       background:linear-gradient(90deg,#c9b277,#56597a);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
       background:radial-gradient(circle at 35% 35%,#fff7e0,#d8c48e);box-shadow:0 0 14px rgba(255,230,170,.55);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;
       background:radial-gradient(circle at 35% 35%,#fff7e0,#d8c48e);box-shadow:0 0 14px rgba(255,230,170,.55)}
  .btn{display:block;margin:30px auto 0;max-width:420px;padding:15px;border-radius:999px;text-decoration:none;
       font-size:17px;font-weight:600;color:#1d1405;background:linear-gradient(180deg,#f0d495,#c9a24e);
       box-shadow:0 10px 30px rgba(220,180,90,.25)}
  .next{margin-top:14px;font-size:14px;color:#9aa3c2}
  .back{display:inline-block;margin-top:24px;font-size:13.5px;color:#b9a8e6;text-decoration:none}
  .tag{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;background:#ffd479;color:#2a1a00;
       font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="tag">PREVIEW</div>
<div class="top">Banjo Spirits &nbsp;·&nbsp; the moon</div>
<div class="stage"><canvas id="c"></canvas></div>
<div class="wrap">
  <div class="date" id="date"></div>
  <h1 class="serif" id="title"></h1>
  <div class="phase serif" id="phase"></div>

  <div class="rule">✦</div>
  <div class="lore-h">What the old folks said</div>
  <p class="lore serif" id="lore"></p>
  <p class="why" id="why"></p>

  <div class="scrub">
    <label><span>Drag through the nights ahead</span><b id="when">Tonight</b></label>
    <input type="range" id="night" min="0" max="29" step="1" value="0" aria-label="Nights ahead">
  </div>

  <a class="btn" id="cta" href="candles.html"></a>
  <div class="next" id="next"></div>
  <a class="back" href="/">‹ Back to the front page</a>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search).get('night');
  var base = q ? new Date(q + (q.length <= 16 ? ':00Z' : '')) : new Date();

  // ---- the moon: same calculation as the wheel page, good to a few hours
  var SYN = 29.530588853, NEW0 = Date.UTC(2000, 0, 6, 18, 14), DAY = 86400000;
  function phaseAt(t){ var p = ((t - NEW0) / DAY / SYN) % 1; return p < 0 ? p + 1 : p; }

  // ---- old names; Harvest = full moon nearest the autumn equinox, Hunter's = the one after
  var NAMES = ['Wolf','Snow','Worm','Pink','Flower','Strawberry','Buck','Sturgeon','Corn','Hunter’s','Beaver','Cold'];
  var WHY = {
    'Wolf':'Named for the wolves heard howling through the long midwinter nights.',
    'Snow':'Named for the heaviest snows of the year, which so often fell in February.',
    'Worm':'Named for the earthworms that show again as the ground thaws.',
    'Pink':'Named for the wild pink phlox, one of the first flowers of spring.',
    'Flower':'Named for the flowers that come out everywhere in May.',
    'Strawberry':'Named for the wild strawberries ripe for picking in June.',
    'Buck':'Named for the new antlers growing on the young bucks.',
    'Sturgeon':'Named for the great fish caught in the lakes at the height of summer.',
    'Corn':'Named for the corn coming in.',
    'Harvest':'The full moon nearest the turn of autumn. It rose bright at dusk, night after night, so farmers could keep bringing the crops in after dark.',
    'Hunter’s':'The full moon after the harvest. The fields were bare, and by its light hunters could see the deer and foxes crossing them.',
    'Beaver':'Named for the time to set beaver traps, before the swamps froze over.',
    'Cold':'Named for the long, cold nights at the turn of the year. It rides highest in the sky of any full moon.'
  };
  function fullMoonName(d){
    var y = d.getUTCFullYear(), eq = Date.UTC(y, 8, 22, 12);
    var back = ((phaseAt(eq) - 0.5 + 1) % 1) * SYN;
    var a = eq - back * DAY, b = a + SYN * DAY;
    var harvest = (Math.abs(a - eq) < Math.abs(b - eq)) ? a : b, hunter = harvest + SYN * DAY;
    if (Math.abs(d.getTime() - harvest) < 2 * DAY) return 'Harvest';
    if (Math.abs(d.getTime() - hunter) < 2 * DAY) return 'Hunter’s';
    return NAMES[d.getUTCMonth()];
  }

  // ---- what the old folks said: real moon-planting lore, the kind still in the almanac
  var LORE = [
    [0.035, 'The Dark of the Moon', 'The dark of the moon was for resting. Nothing was planted and nothing was started. A night for sitting still, and for thinking about the ones who are gone.'],
    [0.25,  'A New Crescent, Growing', 'Plant what grows above the ground while the moon is filling - beans, corn, anything that climbs toward the light. A filling moon was a time for beginnings.'],
    [0.43,  'More Than Half, and Growing', 'A growing moon was thought to pull things upward - the sap in the trees, the water in the ground. Good for sowing, good for setting out on a journey.'],
    [0.475, 'Nearly Full', 'A growing moon was thought to pull things upward - the sap in the trees, the water in the ground. Good for sowing, good for setting out on a journey.'],
    [0.525, 'Full', 'Folks said the full moon pulls on everything that holds water - the tides, the sap, and the blood in us. It was the night for gathering together, and for remembering.'],
    [0.57,  'Just Past Full', 'Plant what grows under the ground while the moon is going down - potatoes, onions, turnips. A shrinking moon was for pulling roots and cutting timber.'],
    [0.75,  'Past Full, Growing Smaller', 'Plant what grows under the ground while the moon is going down - potatoes, onions, turnips. A shrinking moon was for pulling roots and cutting timber.'],
    [0.965, 'A Thin Crescent, Fading', 'The waning moon was the time for letting things go. Clear the ground, mend what is broken, and make ready for the dark.'],
    [1.001, 'The Dark of the Moon', 'The dark of the moon was for resting. Nothing was planted and nothing was started. A night for sitting still, and for thinking about the ones who are gone.']
  ];
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(d){ return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); };

  // ---- the moon face: NASA's Lunar Reconnaissance Orbiter mosaic (public domain)
  var face = new Image(); face.src = 'moon-face.jpg';
  var cv = $('c'), ctx = cv.getContext('2d'), current = 0;

  function render(offsetDays){
    current = offsetDays;
    var t = new Date(base.getTime() + offsetDays * DAY);
    var p = phaseAt(t.getTime());
    var nearFull = Math.abs(p - 0.5) < 0.025;
    var toFull = nearFull ? (0.5 - p) * SYN : ((0.5 - p + 1) % 1) * SYN;
    var fullAt = new Date(t.getTime() + toFull * DAY);
    var nm = fullMoonName(fullAt);
    var L = LORE.filter(function(x){ return p < x[0]; })[0];

    $('date').textContent = (offsetDays === 0 && !q ? 'Tonight · ' : '') + fmt(t);
    $('when').textContent = offsetDays === 0 ? 'Tonight' : offsetDays === 1 ? 'Tomorrow night' : 'In ' + offsetDays + ' nights';
    if (nearFull) {
      $('title').textContent = 'The ' + nm + ' Moon';
      $('phase').textContent = 'Full moon';
      $('cta').textContent = '🕯️  Light a candle under the ' + nm + ' Moon';
      $('next').textContent = '';
      $('why').textContent = WHY[nm];
    } else {
      $('title').textContent = L[1];
      var d = Math.round(toFull);
      $('phase').textContent = d === 1 ? 'The full moon is tomorrow night' : 'The full moon is ' + d + ' nights away';
      $('cta').textContent = '🕯️  Light a candle for someone';
      var night = new Date(fullAt.getTime() - (fullAt.getHours() < 12 ? DAY : 0));
      $('next').textContent = 'Next full moon: the ' + nm + ' Moon, the night of ' + fmt(night) + '.';
      $('why').textContent = 'Coming: the ' + nm + ' Moon. ' + WHY[nm];
    }
    $('lore').textContent = L[2];
    draw(p);
  }

  function draw(p){
    var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var s = 5; function r(){ s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 160; i++) {
      ctx.globalAlpha = 0.2 + r() * 0.6; ctx.fillStyle = '#dfe5f7';
      ctx.beginPath(); ctx.arc(r() * W, r() * H, r() * 1.2 + 0.25, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var mr = Math.min(W * 0.36, H * 0.4), mx = W / 2, my = H * 0.52;
    var f = (1 - Math.cos(2 * Math.PI * p)) / 2, a = mr * (1 - 2 * f), waxing = p < 0.5;

    // glow, brighter as more of it is lit
    // the glow has to fade out before the edge of the canvas, or it ends in a hard line
    var hr = Math.min(mr * 2.6, H - my - 2, my - 2, W / 2);
    var halo = ctx.createRadialGradient(mx, my, mr * 0.9, mx, my, hr);
    halo.addColorStop(0, 'rgba(235,230,210,' + (0.05 + 0.20 * f) + ')'); halo.addColorStop(1, 'rgba(200,205,235,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, hr, 0, 7); ctx.fill();

    ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.clip();
    if (face.complete && face.naturalWidth) {
      ctx.drawImage(face, mx - mr, my - mr, mr * 2, mr * 2);
      // warm it slightly, the way the moon looks low over the trees
      ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,225,170,0.35)';
      ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2); ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.fillStyle = '#cfcab9'; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    }
    // the night side: everything outside the lit lune, left faintly visible (earthshine)
    ctx.beginPath(); var N = 96, dir = waxing ? 1 : -1;
    // the dark region is bounded by the far limb and the terminator
    for (var k = 0; k <= N; k++) { var th = -Math.PI/2 + (k/N) * Math.PI; ctx.lineTo(mx - dir*mr*Math.cos(th), my + mr*Math.sin(th)); }
    for (k = N; k >= 0; k--) { th = -Math.PI/2 + (k/N) * Math.PI; ctx.lineTo(mx + dir*a*Math.cos(th), my + mr*Math.sin(th)); }
    ctx.closePath();
    if ('filter' in ctx) ctx.filter = 'blur(' + Math.max(1.5, mr * 0.025) + 'px)';
    ctx.fillStyle = 'rgba(2,3,10,0.9)'; ctx.fill();
    ctx.filter = 'none';
    // a little darkening at the edge of the disc, as on the real thing
    var limb = ctx.createRadialGradient(mx, my, mr * 0.65, mx, my, mr);
    limb.addColorStop(0, 'rgba(0,0,0,0)'); limb.addColorStop(1, 'rgba(0,0,10,0.35)');
    ctx.fillStyle = limb; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    ctx.restore();
  }

  face.onload = function(){ render(current); };
  $('night').addEventListener('input', function(e){ render(+e.target.value); });
  window.addEventListener('resize', function(){ render(current); });
  render(0);
})();
</script>
</body>
</html>
